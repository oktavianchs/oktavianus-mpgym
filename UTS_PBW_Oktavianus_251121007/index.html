<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP GYM - Pendaftaran Member</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="MpGym.jpeg" alt="Mp Gym.jpg" id="MpGym.jpg" width="100%">
            <figure><figcaption>Created By : Oktavianus - 251121007</figcaption></figure>
        </div>
    </header>

    <main class="container">
        <section class="info-section">
            <h2>Price List</h2>
            <table class="gym-table">  
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Biaya</th>
                        <th>Visit</th>
                        <th>Biaya</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Baru</td>
                        <td>Rp 175.000</td>
                        <td>Umum</td>
                        <td>Rp 20.000</td>
                    </tr>
                    <tr>
                        <td>Lanjutan</td>
                        <td>Rp 150.000</td>
                        <td>Pelajar</td>
                        <td>Rp 15.000</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section class="form-card">
            <h2>Join Our Gym</h2>
            <form id="memberForm">
                <!-- Nama -->
                <div class="form-group">
                    <p></p><label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                </div>
                <div class="form-group">
                    <p></p><label>Jenis Kelamin</label><br>
                    <div class="radio-group">
                        <label><input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki</label>
                        <label><input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan</label>
                    </div>
                </div>
                <div class="form-group">
                    <p></p><label for="alamat">Alamat</label><br>
                    <input type="text" id="alamat" name="alamat" placeholder="Masukkan alamat lengkap" required>
                </div>
                <div class="form-group">
                    <p><label for="telepon">Nomor telepon / Wa</label><br>
                    <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <p></p><label for="Jenis Member">Jenis Member</label><br>
                    <select id="Pilih Member" name="Pilih Member" required>
                    <option value="">-- Pilih Member --</option>
                    <option value="Baru">
                    Baru
                    <option value="Lanjutan">
                    Lanjutan
                    </option></select>
                </div>
                <div class="form-group">
                    <p><label for="Jenis Pembayaran yang sering digunakan">Jenis Pembayaran yang sering digunakan</label><br>
                    <select id="Pilih Pembayarar" name="Pilih Pembayaran" required>
                    <option value="">-- Pilih Pembayaran --</option>
                    <option value="QRIS">
                    QRIS
                    <option value="Transfer">
                    Transfer
                    <option value="Cash">
                    Cash
                    </option></select>
                </div>
                     <label for="tanggal_Pembayara">Tanggal Pembayaran</label><br>
                     <input type="date" id="tanggal_Pembayaran" name="tanggal_Pembayaran">
                <div class="form-group">
                    <p></p><label for="komentar">Komentar & Masukan</label><br>
                    <textarea id="komentar" name="komentar" rows="3" placeholder="Tuliskan Masukan Anda" required></textarea>
                </div>
                <div class="form-group">
                    <p></p><label>Bersedia untuk menjaga kebersihan dan kenyamanan bersama di area Gym!</label><br>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="kebersihan" required> Ya</label>
                    </div>
                </div>
                <div class="form-group">
                    <p></p><label>Bersedia untuke merapikan kembali peralatan yang sudah di gunakan!</label><br>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="peralatan" required> Ya</label>
                    </div>
                </div>

                <p></p><button type="submit" class="btn-submit">Kirim</button>
            </form>
        </section>
            <p>*Jika ada kesulitan atau ada yang mau di tanyakan dapat menghubungi:</p>
            <a href="https://wa.me/" target="_blank" class="social-link">Customer Service (WhatsApp)</a>
        </section>
    </main>
    <script src="script.js"></script>

</body>
</html>
